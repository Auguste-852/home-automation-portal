<!DOCTYPE html>
<html lang="fr"> 

<head>
    <title>My Portal</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" charset="UTF-8" />
    
    <link rel="stylesheet" type="text/css" href="w3.css">
    
    <script type="text/javascript" src="jquery-3.6.3.min.js"></script>
    <script type="text/javascript" src="script.js" defer></script>
    
    <style>
        body {
            background-color: #25292e; 
        }

        .control-panel {
            background-color: #333;
            padding: 20px;
            margin-bottom: 20px;
            color: white;
        }

        .control-panel h2 {
            color: #0f7dd1;
        }

        .control-panel label {
            display: block;
            margin: 10px 0 5px;
        }

        .control-panel input,
        .control-panel button {
            margin-bottom: 10px;
        }

        #clock {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-size: 18px;
            font-family: Arial, sans-serif;
        }

    </style>
</head>

<body class="w3-animate-opacity">

    <div id="clock"></div>

    <div class="w3-card w3-blue w3-padding-small w3-center">
        <h1>My chicken coop</h1>
    </div>
        <div class="w3-margin w3-center w3-card w3-padding-small">
            <h2 style="color:#0f7dd1 ;">Contrôle :</h2>
            
            <button onclick="DoorOpen()" class="w3-button w3-green  w3-ripple w3-wide" style="width: 40%;">Opening the door</button>
            <button onclick="DoorClose()" class="w3-button w3-red  w3-ripple w3-wide" style="width: 40%;">Closing the door</button>
            
            <h3 class="w3-padding">Door State : </h3>
            <p class="w3-xlarge"><span id="DoorState">Not define</span></p>
            
            <h3 class="w3-padding">Time since last food distribution : (in minutes)</h3>
            <p class="w3-xlarge"><span id="timeSinceLastEat">Not define</span></p>
    </div>
        
    <div class="w3-margin w3-center w3-card w3-padding-small">
        <h2 style="color:#0f7dd1 ;">Configuration :</h2>
        <br>
        <h3 style="color:#0f7dd1 ;">Time between food and door closing (in seconds):</h3>
        <input type="number" id="DoorInterval" name="DoorInterval" min="1" max="1440" value="60">

        <h3 style="color:#0f7dd1 ;">Interval between feedings (in hours):</h3> 
        <input type="number" id="FeedInterval" name="FeedInterval" min="1" max="24" value="6">

        <h3 style="color:#0f7dd1 ;">Amount of food:</h3> 
        <input type="number" id="FoodQuantity" name="FoodQuantity" min="0" value="1">

        <h3 style="color:#0f7dd1;">Photoresistor Threshold:</h3>
        <input type="range" id="PhotoresistorThreshold" name="PhotoresistorThreshold" min="0" max="1023" value="512"  oninput="updateThresholdValue(this.value)">
        <span id="thresholdValue">512</span>

        <p class="w3-xlarge w3-center w3-text-white"><span id="input_error2"></span></p>
        <button id="apply2" class="w3-button w3-xlarge w3-ripple w3-wide" style="color:#0f7dd1 ;">Apply</button>

    </div>   
</body>

</html>
